[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
memchr = "2.7"
memmap2 = "0.9"
rustc-hash = "2.1"
mimalloc = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", default-features = false, features = ["arrow"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
